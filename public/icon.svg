<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#151518" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </radialGradient>
    
    <!-- Neon Glow Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Ring Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Background for Maskable Icon compliance -->
  <rect width="512" height="512" fill="url(#bg-grad)" rx="128" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neon-grad)" stroke-width="4" opacity="0.3" filter="url(#glow)" />
  
  <!-- Middle Accent Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#neon-grad)" stroke-width="2" opacity="0.5" stroke-dasharray="10, 15" />

  <!-- Inner Glowing Circle -->
  <circle cx="256" cy="256" r="110" fill="url(#bg-grad)" stroke="url(#neon-grad)" stroke-width="8" filter="url(#glow)" />

  <!-- Monogram "E" with elegant tracking -->
  <text x="256" y="290" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="110" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="-0.05em"
        filter="drop-shadow(0px 0px 12px rgba(236, 72, 153, 0.6))">E</text>
        
  <!-- Small spark/star accent -->
  <path d="M 320 180 L 324 192 L 336 196 L 324 200 L 320 212 L 316 200 L 304 196 L 316 192 Z" fill="#fbcfe8" filter="url(#glow)" />
</svg>
